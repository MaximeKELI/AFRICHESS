global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: africhess-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          tier: api

  - job_name: africhess-ws
    metrics_path: /metrics
    static_configs:
      - targets: ["ws:8001"]
        labels:
          tier: ws

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
