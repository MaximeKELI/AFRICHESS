apiVersion: v1
kind: ConfigMap
metadata:
  name: africhess-config
  namespace: africhess
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  RUN_MIGRATIONS: "false"
  RUN_SEED: "false"
  POSTGRES_HOST: "africhess-db.xxxxx.af-south-1.rds.amazonaws.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "africhess"
  POSTGRES_USER: "africhess"
  POSTGRES_REPLICA_HOST: "africhess-db-replica.xxxxx.af-south-1.rds.amazonaws.com"
  POSTGRES_REPLICA_PORT: "5432"
  USE_READ_REPLICA: "true"
  PGBOUNCER_HOST: "pgbouncer.africhess.svc.cluster.local"
  PGBOUNCER_PORT: "6432"
  ALLOWED_HOSTS: "api.africhess.com,ws.africhess.com,africhess.com"
  CORS_ALLOWED_ORIGINS: "https://africhess.com,https://www.africhess.com"
  FRONTEND_URL: "https://africhess.com"
  FAIRPLAY_BIN: "/usr/local/bin/africhess-fairplay"
  STOCKFISH_PATH: "/usr/games/stockfish"
  PROMETHEUS_METRICS_ENABLED: "true"
  GUNICORN_WORKERS: "4"
