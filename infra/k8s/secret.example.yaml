# Copier vers secret.yaml et remplir (ne pas committer les vraies valeurs).
# kubectl create secret generic africhess-secrets -n africhess --from-env-file=secrets.env
apiVersion: v1
kind: Secret
metadata:
  name: africhess-secrets
  namespace: africhess
type: Opaque
stringData:
  SECRET_KEY: "CHANGE-ME-minimum-fifty-random-characters"
  POSTGRES_PASSWORD: "CHANGE-ME"
  DATABASE_URL: "postgres://africhess:CHANGE-ME@pgbouncer.africhess.svc.cluster.local:6432/africhess"
  REDIS_PASSWORD: "CHANGE-ME"
  REDIS_URL: "redis://:CHANGE-ME@elasticache-cluster.xxxxx.af-south-1.cache.amazonaws.com:6379/0"
  REDIS_CHANNELS_URLS: "redis://:CHANGE-ME@elasticache-cluster.xxxxx.af-south-1.cache.amazonaws.com:6379/1"
  REDIS_CELERY_URL: "redis://:CHANGE-ME@elasticache-cluster.xxxxx.af-south-1.cache.amazonaws.com:6379/2"
  REDIS_MATCHMAKING_URL: "redis://:CHANGE-ME@elasticache-cluster.xxxxx.af-south-1.cache.amazonaws.com:6379/3"
  REDIS_CACHE_URL: "redis://:CHANGE-ME@elasticache-cluster.xxxxx.af-south-1.cache.amazonaws.com:6379/4"
  EMAIL_HOST: "email-smtp.af-south-1.amazonaws.com"
  EMAIL_HOST_USER: "CHANGE-ME"
  EMAIL_HOST_PASSWORD: "CHANGE-ME"
  DEFAULT_FROM_EMAIL: "noreply@africhess.com"
  USE_S3_MEDIA: "true"
  AWS_STORAGE_BUCKET_NAME: "africhess-media-prod"
  AWS_S3_REGION_NAME: "af-south-1"
  AWS_S3_CUSTOM_DOMAIN: "media.africhess.com"
  AWS_ACCESS_KEY_ID: "CHANGE-ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE-ME"
  SENTRY_DSN: "https://examplePublicKey@o0.ingest.sentry.io/0"
  SENTRY_ENVIRONMENT: "production"
