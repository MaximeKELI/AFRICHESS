apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: africhess
  namespace: africhess
  annotations:
    # AWS Load Balancer Controller (EKS af-south-1)
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:af-south-1:123456789012:certificate/CHANGE-ME
    # Sticky WS — cookie ALB pour sessions longues
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=3600
    # Alternative nginx-ingress :
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/affinity: "cookie"
    # nginx.ingress.kubernetes.io/affinity-mode: "persistent"
spec:
  rules:
    - host: api.africhess.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: africhess-api
                port:
                  number: 8000
    - host: ws.africhess.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: africhess-ws
                port:
                  number: 8001
