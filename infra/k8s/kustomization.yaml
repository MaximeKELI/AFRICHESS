apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: africhess

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - pgbouncer.yaml
  - api.yaml
  - ws.yaml
  - celery.yaml
  - ingress.yaml
  - hpa.yaml
  - servicemonitor.yaml

images:
  - name: 123456789012.dkr.ecr.af-south-1.amazonaws.com/africhess-backend
    newTag: latest

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: africhess
