apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: africhess
  labels:
    app: celery-beat
    tier: beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
        tier: beat
    spec:
      containers:
        - name: beat
          image: 123456789012.dkr.ecr.af-south-1.amazonaws.com/africhess-backend:latest
          command:
            - celery
            - -A
            - config
            - beat
            - -l
            - info
          envFrom:
            - configMapRef:
                name: africhess-config
            - secretRef:
                name: africhess-secrets
          env:
            - name: AFRICHESS_TIER
              value: beat
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
