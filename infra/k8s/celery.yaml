apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-realtime
  namespace: africhess
  labels:
    app: celery-realtime
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-realtime
  template:
    metadata:
      labels:
        app: celery-realtime
        tier: worker
    spec:
      containers:
        - name: worker
          image: 123456789012.dkr.ecr.af-south-1.amazonaws.com/africhess-backend:latest
          command:
            - celery
            - -A
            - config
            - worker
            - -l
            - info
            - -Q
            - realtime
            - -c
            - "4"
          envFrom:
            - configMapRef:
                name: africhess-config
            - secretRef:
                name: africhess-secrets
          env:
            - name: AFRICHESS_TIER
              value: worker
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-analysis
  namespace: africhess
  labels:
    app: celery-analysis
    tier: worker-cpu
spec:
  replicas: 4
  selector:
    matchLabels:
      app: celery-analysis
  template:
    metadata:
      labels:
        app: celery-analysis
        tier: worker-cpu
    spec:
      nodeSelector:
        workload: cpu-intensive
      tolerations:
        - key: cpu-intensive
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: worker
          image: 123456789012.dkr.ecr.af-south-1.amazonaws.com/africhess-backend:latest
          command:
            - celery
            - -A
            - config
            - worker
            - -l
            - info
            - -Q
            - analysis
            - -c
            - "2"
          envFrom:
            - configMapRef:
                name: africhess-config
            - secretRef:
                name: africhess-secrets
          env:
            - name: AFRICHESS_TIER
              value: worker
          resources:
            requests:
              cpu: "3500m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
---
