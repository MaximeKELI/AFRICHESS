apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: africhess-api
  namespace: africhess
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: africhess-api
  minReplicas: 4
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: africhess-ws
  namespace: africhess
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: africhess-ws
  minReplicas: 8
  maxReplicas: 32
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # Métrique custom (nécessite prometheus-adapter) :
    # - type: Pods
    #   pods:
    #     metric:
    #       name: africhess_ws_connections_active
    #     target:
    #       type: AverageValue
    #       averageValue: "12000"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 2
          periodSeconds: 180
---
